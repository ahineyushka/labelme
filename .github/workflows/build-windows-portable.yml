name: Build portable Windows app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Labelme for Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Labelme and PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # NumPy 2.4+ requires the x86-64-v2 instruction set (including SSE4.2).
          # Keep NumPy below 2.4 so the app can run on older CPUs.
          python -m pip install "numpy<2.4" . pyinstaller
          python -c "import numpy; print('Using NumPy', numpy.__version__); assert tuple(int(p) for p in numpy.__version__.split('.')[:2]) < (2, 4)"

      - name: Create an entry-point wrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          @'
          import multiprocessing
          import sys

          def _portable_smoke_worker(connection):
              connection.send("spawn-ok")
              connection.close()

          if __name__ == "__main__":
              # Required by PyInstaller on Windows before importing app modules:
              # multiprocessing workers start by re-launching this executable.
              multiprocessing.freeze_support()

              if "--portable-smoke-test" in sys.argv:
                  import importlib.metadata
                  import numpy
                  import osam

                  # This path checks NumPy, OSAM and gdown metadata without opening the GUI.
                  print(f"Labelme {importlib.metadata.version('labelme')}")
                  print(f"NumPy {numpy.__version__}")
                  print(f"gdown {importlib.metadata.version('gdown')}")

                  # Verify frozen multiprocessing too, which the model downloader uses.
                  context = multiprocessing.get_context("spawn")
                  receive_connection, send_connection = context.Pipe(duplex=False)
                  process = context.Process(
                      target=_portable_smoke_worker,
                      args=(send_connection,),
                  )
                  process.start()
                  send_connection.close()
                  process.join(timeout=30)
                  if process.is_alive():
                      process.terminate()
                      process.join()
                      raise RuntimeError("Packaged multiprocessing smoke test timed out.")
                  if process.exitcode != 0:
                      raise RuntimeError(
                          f"Packaged multiprocessing child exited with code {process.exitcode}."
                      )
                  if not receive_connection.poll(5):
                      raise RuntimeError("Packaged multiprocessing child sent no result.")
                  result = receive_connection.recv()
                  receive_connection.close()
                  if result != "spawn-ok":
                      raise RuntimeError(f"Unexpected multiprocessing result: {result!r}")
                  print("Packaged multiprocessing spawn: OK")
                  raise SystemExit(0)

              # Import NumPy before Labelme so ONNX Runtime sees NumPy initialized on Windows.
              import numpy

              from labelme.__main__ import main

              main()
          '@ | Set-Content -Path build/labelme_launcher.py -Encoding utf8

      - name: Build portable application
        shell: pwsh
        run: |
          $osamPath = python -c "import os, osam; print(os.path.dirname(osam.__file__))"
          $bpePath = Join-Path $osamPath "_models/yoloworld/clip/bpe_simple_vocab_16e6.txt.gz"
          if (-not (Test-Path $bpePath)) {
            throw "Required OSAM vocabulary file was not found: $bpePath"
          }

          $configPath = (Resolve-Path "labelme/_config/default_config.yaml").Path
          $iconsPath = (Resolve-Path "labelme/icons").Path
          $translatePath = (Resolve-Path "labelme/translate").Path
          $iconPath = (Resolve-Path "labelme/icons/icon-256.png").Path

          pyinstaller build/labelme_launcher.py `
            --name=Labelme `
            --windowed `
            --noconfirm `
            --clean `
            --specpath=build `
            --add-data "$bpePath;osam/_models/yoloworld/clip" `
            --add-data "$configPath;labelme/_config" `
            --add-data "$iconsPath;labelme/icons" `
            --add-data "$translatePath;labelme/translate" `
            --copy-metadata gdown `
            --icon "$iconPath" `
            --onedir

          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller failed with exit code $LASTEXITCODE"
          }

      - name: Build console smoke-test executable
        shell: pwsh
        run: |
          $osamPath = python -c "import os, osam; print(os.path.dirname(osam.__file__))"
          $bpePath = Join-Path $osamPath "_models/yoloworld/clip/bpe_simple_vocab_16e6.txt.gz"
          $configPath = (Resolve-Path "labelme/_config/default_config.yaml").Path
          $iconsPath = (Resolve-Path "labelme/icons").Path
          $translatePath = (Resolve-Path "labelme/translate").Path

          pyinstaller build/labelme_launcher.py `
            --name=LabelmeSmoke `
            --console `
            --noconfirm `
            --distpath=build/smoke-dist `
            --workpath=build/smoke-work `
            --specpath=build/smoke-spec `
            --add-data "$bpePath;osam/_models/yoloworld/clip" `
            --add-data "$configPath;labelme/_config" `
            --add-data "$iconsPath;labelme/icons" `
            --add-data "$translatePath;labelme/translate" `
            --copy-metadata gdown `
            --onedir

          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller smoke-test build failed with exit code $LASTEXITCODE"
          }

      - name: Check the executables
        shell: pwsh
        run: |
          $guiExe = Join-Path $PWD "dist/Labelme/Labelme.exe"
          if (-not (Test-Path $guiExe)) {
            throw "Build did not produce the expected GUI executable: $guiExe"
          }
          if ((Get-Item $guiExe).Length -lt 100000) {
            throw "The GUI executable is unexpectedly small."
          }

          $smokeExe = Join-Path $PWD "build/smoke-dist/LabelmeSmoke/LabelmeSmoke.exe"
          if (-not (Test-Path $smokeExe)) {
            throw "Build did not produce the console smoke-test executable: $smokeExe"
          }
          $versionOutput = & $smokeExe --portable-smoke-test 2>&1
          $exitCode = $LASTEXITCODE
          $versionOutput | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            throw "The packaged console smoke test exited with code $exitCode"
          }
          $smokeText = $versionOutput -join "`n"
          if ($smokeText -notmatch "Labelme" -or $smokeText -notmatch "gdown") {
            throw "The packaged smoke test did not report both Labelme and gdown metadata."
          }

      - name: Upload portable application
        uses: actions/upload-artifact@v7
        with:
          name: Labelme-Windows-x64
          path: dist/Labelme/
          if-no-files-found: error
          retention-days: 14
